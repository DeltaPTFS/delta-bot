name: Python syntax

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m compileall -q bot
      - name: Validate support formats
        run: python -m json.tool bot/support_formats.json >/dev/null
